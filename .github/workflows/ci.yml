name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run, e.g. after adding the DATABASE_URL secret.
  workflow_dispatch:

# Two independent gates.
#
# `build` always runs and needs no credentials: lint plus the production build,
# which is also the typecheck gate. lib/db throws at module scope without a
# DATABASE_URL, so a syntactically valid placeholder is present — nothing
# connects to it.
#
# Lint is BLOCKING here. Tavern had to run it with continue-on-error because of
# a pre-existing violation in its chat loop; latent's was fixed before CI landed
# precisely so this could be a real gate on day one.
#
# `smoke` runs the integration smoke, which is READ-ONLY by design, so it needs
# no throwaway database branch and can safely point at the real one. It
# self-skips when DATABASE_URL is absent, so a fork gets a green build gate
# rather than a red herring.

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Never connected to. Present only because lib/db throws without it.
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
          AUTH_SECRET: build-time-placeholder

  preflight:
    name: Check for database credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DATABASE_URL secret not set — skipping the integration smoke job."
          fi

  smoke:
    name: Integration smoke (read-only)
    runs-on: ubuntu-latest
    needs: [build, preflight]
    if: needs.preflight.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # npm test loads .env, which does not exist in CI. The secret is passed
      # through the environment instead; --env-file is tolerant of the missing
      # file, so the same command works in both places.
      - name: Run integration smoke
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/integration-smoke.mts
