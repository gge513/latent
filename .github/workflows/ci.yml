name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run, e.g. after adding the DATABASE_URL secret.
  workflow_dispatch:

# Two independent gates.
#
# `build` always runs: lint plus the production build, which is also the
# typecheck gate.
#
# It uses the real DATABASE_URL when the secret is present, so CI builds the
# same way Vercel does, prerendering all thirty builder pages. Without the
# secret it falls back to a placeholder that cannot connect, and the build still
# goes green: generateStaticParams and the home page both tolerate an
# unreachable database at BUILD time and fall back to on-demand rendering.
#
# That tolerance was added because of this workflow's first run, which went red
# here. The shape of this file was lifted from Tavern, whose comment said every
# route was dynamic so a placeholder was enough. That is not true of latent —
# /b/[handle] prerenders from the database — and the claim was carried over
# without being checked. CI caught it on the first push, which is the argument
# for having it.
#
# Lint is BLOCKING here. Tavern had to run it with continue-on-error because of
# a pre-existing violation in its chat loop; latent's was fixed before CI landed
# precisely so this could be a real gate on day one.
#
# `smoke` runs the integration smoke, which is READ-ONLY by design, so it needs
# no throwaway database branch and can safely point at the real one. It
# self-skips when DATABASE_URL is absent, so a fork gets a green build gate
# rather than a red herring.

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Real when the secret exists, so CI prerenders what Vercel does.
          # Otherwise a placeholder that cannot connect, which the build
          # tolerates: lib/db throws at module scope without any value at all,
          # so something has to be here.
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://user:pass@localhost:5432/placeholder' }}
          AUTH_SECRET: build-time-placeholder

  preflight:
    name: Check for database credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DATABASE_URL secret not set — skipping the integration smoke job."
          fi

  smoke:
    name: Integration smoke (read-only)
    runs-on: ubuntu-latest
    needs: [build, preflight]
    if: needs.preflight.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # npm test loads .env, which does not exist in CI. The secret is passed
      # through the environment instead; --env-file is tolerant of the missing
      # file, so the same command works in both places.
      - name: Run integration smoke
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/integration-smoke.mts
